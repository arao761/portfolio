<app-booting-screen></app-booting-screen>

@if (showContent()) {
  <div class="portfolio-content relative">
    <!-- Global animated background elements -->
    <div class="pointer-events-none fixed inset-0 -z-10">
      <div class="absolute -top-40 -left-20 w-[40rem] h-[40rem] bg-gradient-to-br from-blue-500/20 via-cyan-400/10 to-transparent rounded-full blur-3xl animate-pulse"></div>
      <div class="absolute -bottom-40 -right-32 w-[45rem] h-[45rem] bg-gradient-to-tr from-cyan-500/20 via-blue-400/10 to-transparent rounded-full blur-3xl animate-pulse" style="animation-delay: 1.2s"></div>
      <div class="absolute inset-0 opacity-[0.06]" style="background-image: radial-gradient(circle at 1px 1px, #ffffff 1px, transparent 0); background-size: 22px 22px;"></div>
    </div>

    <!-- Cursor glow -->
    <div id="cursor-glow" class="pointer-events-none fixed w-40 h-40 -translate-x-1/2 -translate-y-1/2 rounded-full bg-cyan-500/10 blur-2xl mix-blend-screen z-40"></div>
    <app-hero></app-hero>
    <app-projects></app-projects>
    <app-experience></app-experience>
    <app-skills></app-skills>
    <app-contact></app-contact>
  </div>
}
