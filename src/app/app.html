<!-- Booting Screen -->
@if (showBootScreen()) {
  <app-booting-screen></app-booting-screen>
}

<!-- Theme Toggle -->
<app-theme-toggle></app-theme-toggle>

@if (showContent()) {
  <div class="portfolio-content relative min-h-screen">
    <!-- Subtle background gradients for depth -->
    <div class="pointer-events-none fixed inset-0 -z-10">
      <!-- Light mode gradients -->
      <div class="absolute top-0 left-1/4 w-[600px] h-[600px] bg-gradient-to-br from-blue-50 via-purple-50 to-transparent rounded-full blur-3xl opacity-60 dark:opacity-0 transition-opacity duration-500" data-parallax="0.1"></div>
      <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-gradient-to-tl from-emerald-50 via-blue-50 to-transparent rounded-full blur-3xl opacity-60 dark:opacity-0 transition-opacity duration-500" data-parallax="0.15"></div>

      <!-- Dark mode gradients -->
      <div class="absolute top-1/4 right-1/3 w-[500px] h-[500px] bg-gradient-to-br from-purple-900/20 via-blue-900/10 to-transparent rounded-full blur-3xl opacity-0 dark:opacity-100 transition-opacity duration-500" data-parallax="0.12"></div>
      <div class="absolute bottom-1/3 left-1/4 w-[600px] h-[600px] bg-gradient-to-tr from-blue-900/20 via-emerald-900/10 to-transparent rounded-full blur-3xl opacity-0 dark:opacity-100 transition-opacity duration-500" data-parallax="0.18"></div>
    </div>

    <!-- Main content sections -->
    <app-hero></app-hero>
    <app-experience></app-experience>
    <app-projects></app-projects>
    <app-skills></app-skills>
    <app-contact></app-contact>
  </div>
}
