<section id="contact" class="py-12 sm:py-16 md:py-20 px-4 sm:px-6 md:px-8 relative">
  <div class="max-w-4xl mx-auto">
    <!-- Section content -->
    <div class="text-center mb-12 sm:mb-16 md:mb-20 lg:mb-24" data-parallax="0.03">
      <div class="inline-block px-3 sm:px-4 py-1.5 sm:py-2 rounded-full bg-light-bg-tertiary dark:bg-dark-bg-tertiary border border-light-border dark:border-dark-border mb-4 sm:mb-6">
        <span class="text-xs sm:text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary">Let's Connect</span>
      </div>
      <h2 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold text-light-text-primary dark:text-dark-text-primary mb-4 sm:mb-6">
        Get In Touch
      </h2>
      <p class="text-base sm:text-lg text-light-text-secondary dark:text-dark-text-secondary max-w-2xl mx-auto px-4">
        I'm always open to discussing new opportunities, interesting projects, or just having a chat about technology.
      </p>
    </div>

    <!-- Contact cards -->
    <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4 mb-8 sm:mb-12 md:mb-16 lg:mb-20" data-parallax="0.05">
      <!-- Email -->
      <a
        [href]="'mailto:' + personalInfo.email"
        class="group relative card-spotlight">
        <div class="relative bg-white dark:bg-dark-bg-secondary border border-light-border dark:border-dark-border rounded-2xl p-4 sm:p-5 md:p-6 hover:border-accent-primary/30 dark:hover:border-accent-secondary/30 transition-all duration-300 hover:shadow-xl text-center">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-accent-primary/10 dark:bg-accent-secondary/10 flex items-center justify-center mx-auto mb-3 sm:mb-4 group-hover:scale-110 transition-transform duration-300">
            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-accent-primary dark:text-accent-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </div>
          <p class="text-xs sm:text-sm font-medium text-light-text-tertiary dark:text-dark-text-tertiary mb-1 sm:mb-2">Email</p>
          <p class="text-xs sm:text-sm text-light-text-secondary dark:text-dark-text-secondary break-all">{{ personalInfo.email }}</p>
        </div>
      </a>

      <!-- LinkedIn -->
      <a
        [href]="personalInfo.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="group relative card-spotlight">
        <div class="relative bg-white dark:bg-dark-bg-secondary border border-light-border dark:border-dark-border rounded-2xl p-4 sm:p-5 md:p-6 hover:border-accent-primary/30 dark:hover:border-accent-secondary/30 transition-all duration-300 hover:shadow-xl text-center">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-accent-primary/10 dark:bg-accent-secondary/10 flex items-center justify-center mx-auto mb-3 sm:mb-4 group-hover:scale-110 transition-transform duration-300">
            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-accent-primary dark:text-accent-secondary" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </div>
          <p class="text-xs sm:text-sm font-medium text-light-text-tertiary dark:text-dark-text-tertiary mb-1 sm:mb-2">LinkedIn</p>
          <p class="text-xs sm:text-sm text-light-text-secondary dark:text-dark-text-secondary">Connect with me</p>
        </div>
      </a>

      <!-- GitHub -->
      <a
        [href]="personalInfo.github"
        target="_blank"
        rel="noopener noreferrer"
        class="group relative card-spotlight">
        <div class="relative bg-white dark:bg-dark-bg-secondary border border-light-border dark:border-dark-border rounded-2xl p-4 sm:p-5 md:p-6 hover:border-accent-primary/30 dark:hover:border-accent-secondary/30 transition-all duration-300 hover:shadow-xl text-center">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-accent-primary/10 dark:bg-accent-secondary/10 flex items-center justify-center mx-auto mb-3 sm:mb-4 group-hover:scale-110 transition-transform duration-300">
            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-accent-primary dark:text-accent-secondary" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
          </div>
          <p class="text-xs sm:text-sm font-medium text-light-text-tertiary dark:text-dark-text-tertiary mb-1 sm:mb-2">GitHub</p>
          <p class="text-xs sm:text-sm text-light-text-secondary dark:text-dark-text-secondary">View my code</p>
        </div>
      </a>
    </div>

    <!-- Footer -->
    <div class="text-center border-t border-light-border dark:border-dark-border pt-6 sm:pt-8">
      <p class="text-xs sm:text-sm text-light-text-tertiary dark:text-dark-text-tertiary">
        © 2025 {{ personalInfo.name }}. All rights reserved.
      </p>
    </div>
  </div>
</section>
