<footer id="contact" class="mt-24 reveal">
  <div class="hairline pt-12">
    <h2 class="font-serif text-2xl font-medium mb-4 italic">Get in touch</h2>

    <p class="text-[0.95rem] leading-relaxed text-ink-secondary dark:text-ink-dark-secondary max-w-prose mb-8">
      I'm always happy to talk about agents, infrastructure, or whatever you're building.
      The fastest way to reach me is email at
      <a [href]="'mailto:' + personalInfo.email" class="link">{{ personalInfo.email }}</a>.
    </p>

    <div class="flex flex-wrap items-center justify-between gap-4">
      <nav class="flex flex-wrap gap-x-6 gap-y-2 text-sm">
        <a [href]="personalInfo.github" target="_blank" rel="noopener noreferrer" class="link-quiet">GitHub</a>
        <a [href]="personalInfo.linkedin" target="_blank" rel="noopener noreferrer" class="link-quiet">LinkedIn</a>
        <a [href]="personalInfo.scyntic" target="_blank" rel="noopener noreferrer" class="link-quiet">Scyntic</a>
        <a [href]="personalInfo.resume" target="_blank" rel="noopener noreferrer" class="link-quiet">Resume</a>
      </nav>

      <p class="font-mono text-xs text-ink-tertiary dark:text-ink-dark-tertiary">
        © {{ currentYear }} {{ personalInfo.name }}
      </p>
    </div>
  </div>
</footer>
