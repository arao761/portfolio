<section id="experience" class="mt-24 reveal">
  <h2 class="label-mono mb-10">Experience</h2>

  <div class="space-y-14">
    @for (exp of experiences; track exp.company) {
      <article class="grid sm:grid-cols-[9.5rem_1fr] gap-x-8 gap-y-2">
        <p class="font-mono text-xs text-ink-tertiary dark:text-ink-dark-tertiary pt-1 whitespace-nowrap">
          {{ exp.period }}
        </p>

        <div>
          <h3 class="font-serif text-xl font-medium mb-1">
            {{ exp.title }}
            <span class="text-ink-tertiary dark:text-ink-dark-tertiary font-normal mx-1.5">·</span>
            @if (exp.url) {
              <a [href]="exp.url" target="_blank" rel="noopener noreferrer" class="link decoration-transparent">{{ exp.company }}</a>
            } @else {
              {{ exp.company }}
            }
          </h3>

          <ul class="mt-3 space-y-2.5">
            @for (line of exp.description; track line) {
              <li class="text-[0.95rem] leading-relaxed text-ink-secondary dark:text-ink-dark-secondary pl-4 relative">
                <span class="absolute left-0 top-[0.72em] h-px w-2 bg-ink-tertiary dark:bg-ink-dark-tertiary"></span>
                {{ line }}
              </li>
            }
          </ul>

          <p class="mt-4 font-mono text-xs text-ink-tertiary dark:text-ink-dark-tertiary">
            {{ exp.techStack.join(' · ') }}
          </p>
        </div>
      </article>
    }
  </div>
</section>
