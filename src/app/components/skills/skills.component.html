<section id="skills" class="py-32 px-4 md:px-8 relative bg-black/50">
  <div class="max-w-6xl mx-auto section-reveal">
    <h2 class="text-5xl md:text-7xl font-bold mb-20 text-center">
      <span class="bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
        Skills
      </span>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      @for (skillCategory of skills; track skillCategory.category; let i = $index) {
        <div 
          class="skill-category"
          [attr.data-skill-index]="i"
          [class.opacity-100]="visibleSkills().has(i)"
          [class.opacity-0]="!visibleSkills().has(i)"
          [class.translate-y-0]="visibleSkills().has(i)"
          [class.translate-y-10]="!visibleSkills().has(i)"
          [class.transition-all]="true"
          [class.duration-700]="true"
          [style.animation-delay.ms]="i * 100">
          
          <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-6 hover:border-blue-500/50 transition-all">
            <h3 class="text-2xl font-bold text-white mb-6">
              {{ skillCategory.category }}
            </h3>
            <div class="flex flex-wrap gap-3">
              @for (item of skillCategory.items; track item) {
                <span class="px-4 py-2 bg-gradient-to-r from-blue-500/10 to-cyan-500/10 border border-blue-500/30 rounded-full text-sm text-blue-300 hover:from-blue-500/20 hover:to-cyan-500/20 hover:border-blue-500/50 hover:scale-105 transition-all cursor-default">
                  {{ item }}
                </span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
