<section id="skills" class="mt-24 reveal">
  <h2 class="label-mono mb-10">Skills</h2>

  <div class="space-y-5">
    @for (skillCategory of skills; track skillCategory.category) {
      <div class="grid sm:grid-cols-[9.5rem_1fr] gap-x-8 gap-y-1">
        <p class="font-mono text-xs text-ink-tertiary dark:text-ink-dark-tertiary pt-0.5 whitespace-nowrap">
          {{ skillCategory.category }}
        </p>
        <p class="text-[0.95rem] leading-relaxed text-ink-secondary dark:text-ink-dark-secondary">
          {{ skillCategory.items.join(', ') }}
        </p>
      </div>
    }
  </div>
</section>
