@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black transition-opacity duration-500" 
       [class.opacity-0]="!isVisible()"
       [class.pointer-events-none]="!isVisible()">
    <div class="font-mono text-green-400">
      <div class="space-y-2">
        @for (message of bootMessages(); track $index) {
          <div class="text-sm md:text-base">
            <span class="text-green-500">$</span>
            <span>{{ message }}</span>
            @if ($index === currentMessageIndex && isTyping()) {
              <span class="animate-pulse">|</span>
            }
          </div>
        }
      </div>
    </div>
  </div>
}
