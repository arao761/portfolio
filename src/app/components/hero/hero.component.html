<section class="min-h-screen flex items-center justify-center relative overflow-hidden">
  <!-- Animated background -->
  <div class="absolute inset-0 bg-gradient-to-br from-gray-900 via-black to-gray-900">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,rgba(14,165,233,0.1),transparent_50%)]"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    <!-- Subtle moving light sweep -->
    <div class="absolute -inset-x-20 top-1/3 h-24 bg-gradient-to-r from-transparent via-white/5 to-transparent blur-xl animate-[sweep_6s_linear_infinite]"></div>
  </div>

  <!-- Content -->
  <div class="relative z-10 text-center px-4 md:px-8 max-w-5xl mx-auto">
    <h1 class="text-6xl md:text-8xl lg:text-9xl font-bold mb-6 animate-fade-in underline-gradient">
      <span class="bg-gradient-to-r from-blue-400 via-cyan-400 to-blue-600 bg-clip-text text-transparent">
        {{ personalInfo.name }}
      </span>
    </h1>
    
    <p class="text-xl md:text-2xl lg:text-3xl text-gray-300 mb-8 animate-slide-up" style="animation-delay: 0.2s;">
      {{ personalInfo.title }}
    </p>
    
    <p class="text-base md:text-lg text-gray-400 max-w-2xl mx-auto mb-12 animate-slide-up" style="animation-delay: 0.4s;">
      {{ personalInfo.bio }}
    </p>

    <div class="flex justify-center gap-4">
      <a href="#projects" class="px-6 py-3 rounded-xl border border-white/10 text-white hover:bg-white/5 transition">
        View Projects
      </a>
    </div>

    <!-- Scroll indicator -->
    <div class="animate-bounce mt-16">
      <svg class="w-6 h-6 mx-auto text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
      </svg>
    </div>
  </div>
</section>
