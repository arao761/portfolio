<section class="min-h-screen flex items-center justify-center relative overflow-hidden px-4 sm:px-6 md:px-8 py-8 sm:py-0">
  <!-- Content -->
  <div class="relative z-10 max-w-6xl mx-auto w-full">
    <div class="grid lg:grid-cols-2 gap-8 sm:gap-12 lg:gap-20 items-center">
      <!-- Left column: Text content -->
      <div class="space-y-5 sm:space-y-6 md:space-y-8" data-parallax="0.05">
        <!-- Bitmoji Avatar -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 sm:gap-4 md:gap-6 mb-2 sm:mb-4">
          <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full border-4 border-light-border dark:border-dark-border bg-light-bg-tertiary dark:bg-dark-bg-tertiary flex items-center justify-center overflow-hidden animate-fade-in flex-shrink-0">
            <!-- Replace the src below with your Bitmoji image URL -->
            <img src="bitmoji_picture.png" alt="Bitmoji Avatar" class="w-full h-full object-cover" />
          </div>
          <!-- Badge moved next to avatar -->
          <div class="inline-flex items-center gap-2 px-3 sm:px-4 py-1.5 sm:py-2 rounded-full bg-light-bg-tertiary dark:bg-dark-bg-tertiary border border-light-border dark:border-dark-border animate-fade-in">
            <span class="relative flex h-2 w-2 flex-shrink-0">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span class="text-xs sm:text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary">Available for opportunities</span>
          </div>
        </div>

        <!-- Name with subtle underline -->
        <div class="space-y-3 sm:space-y-4 animate-slide-up" style="animation-delay: 0.1s;">
          <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight">
            <span class="block text-light-text-primary dark:text-dark-text-primary">
              {{ personalInfo.name }}
            </span>
          </h1>
          <div class="h-1 w-12 sm:w-16 bg-gradient-to-r from-accent-primary dark:from-accent-secondary to-transparent"></div>
        </div>

        <!-- Title -->
        <p class="text-xl sm:text-2xl md:text-3xl font-medium text-light-text-secondary dark:text-dark-text-secondary animate-slide-up" style="animation-delay: 0.2s;">
          {{ personalInfo.title }}
        </p>

        <!-- Bio -->
        <p class="text-base sm:text-lg text-light-text-tertiary dark:text-dark-text-tertiary max-w-xl leading-relaxed animate-slide-up" style="animation-delay: 0.3s;">
          {{ personalInfo.bio }}
        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-wrap gap-3 sm:gap-4 pt-2 sm:pt-4 animate-slide-up" style="animation-delay: 0.4s;">
          <a
            href="#experience"
            class="group px-5 sm:px-6 py-2.5 sm:py-3 rounded-lg bg-accent-primary dark:bg-accent-secondary text-white dark:text-black font-medium hover:scale-105 transition-all duration-300 shadow-lg hover:shadow-xl text-sm sm:text-base"
          >
            View Experience
            <svg class="inline-block w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>
          </a>
          <a
            href="#contact"
            class="px-5 sm:px-6 py-2.5 sm:py-3 rounded-lg border-2 border-light-border dark:border-dark-border text-light-text-primary dark:text-dark-text-primary font-medium hover:bg-light-bg-tertiary dark:hover:bg-dark-bg-tertiary transition-all duration-300 text-sm sm:text-base"
          >
            Get in Touch
          </a>
        </div>

        <!-- Social Links -->
        <div class="flex gap-3 sm:gap-4 pt-1 sm:pt-2 animate-slide-up" style="animation-delay: 0.5s;">
          <a
            [href]="personalInfo.github"
            target="_blank"
            rel="noopener noreferrer"
            class="p-3 rounded-lg border border-light-border dark:border-dark-border hover:bg-light-bg-tertiary dark:hover:bg-dark-bg-tertiary transition-all duration-300 hover:scale-110 group"
            aria-label="GitHub"
          >
            <svg class="w-5 h-5 text-light-text-secondary dark:text-dark-text-secondary group-hover:text-light-text-primary dark:group-hover:text-dark-text-primary transition-colors" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
          </a>
          <a
            [href]="personalInfo.linkedin"
            target="_blank"
            rel="noopener noreferrer"
            class="p-3 rounded-lg border border-light-border dark:border-dark-border hover:bg-light-bg-tertiary dark:hover:bg-dark-bg-tertiary transition-all duration-300 hover:scale-110 group"
            aria-label="LinkedIn"
          >
            <svg class="w-5 h-5 text-light-text-secondary dark:text-dark-text-secondary group-hover:text-light-text-primary dark:group-hover:text-dark-text-primary transition-colors" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- Right column: Visual element with parallax -->
      <div class="relative lg:block hidden" data-parallax="0.08">
        <div class="relative w-full aspect-square">
          <!-- Floating cards with stats -->
          <div class="absolute top-0 right-0 p-6 rounded-2xl glass shadow-xl animate-float">
            <div class="text-3xl font-bold text-light-text-primary dark:text-dark-text-primary">3+</div>
            <div class="text-sm text-light-text-tertiary dark:text-dark-text-tertiary mt-1">Years Experience</div>
          </div>

          <div class="absolute bottom-20 left-0 p-6 rounded-2xl glass shadow-xl animate-float" style="animation-delay: 1s;">
            <div class="text-3xl font-bold text-light-text-primary dark:text-dark-text-primary">15+</div>
            <div class="text-sm text-light-text-tertiary dark:text-dark-text-tertiary mt-1">Projects Built</div>
          </div>

          <div class="absolute top-1/2 right-1/4 p-6 rounded-2xl glass shadow-xl animate-float" style="animation-delay: 2s;">
            <div class="text-3xl font-bold text-light-text-primary dark:text-dark-text-primary">AI/ML</div>
            <div class="text-sm text-light-text-tertiary dark:text-dark-text-tertiary mt-1">Specialization</div>
          </div>

          <!-- Decorative elements -->
          <div class="absolute inset-0 -z-10">
            <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-accent-purple/20 rounded-full blur-3xl"></div>
            <div class="absolute bottom-1/4 right-1/4 w-40 h-40 bg-accent-blue/20 rounded-full blur-3xl"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scroll indicator -->
    <div class="absolute bottom-6 sm:bottom-12 left-1/2 -translate-x-1/2 animate-bounce">
      <svg class="w-5 h-5 sm:w-6 sm:h-6 text-light-text-tertiary dark:text-dark-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
      </svg>
    </div>
  </div>
</section>
