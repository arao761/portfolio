<header class="reveal">
  <div class="flex items-center gap-2.5 mb-8">
    <span class="relative flex h-2 w-2">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent dark:bg-accent-dark opacity-60"></span>
      <span class="relative inline-flex rounded-full h-2 w-2 bg-accent dark:bg-accent-dark"></span>
    </span>
    <span class="label-mono">Currently building <a [href]="personalInfo.scyntic" target="_blank" rel="noopener noreferrer" class="link-quiet normal-case tracking-normal font-mono">scyntic.ai</a></span>
  </div>

  <h1 class="font-serif text-5xl sm:text-6xl font-medium tracking-tight mb-4">
    {{ personalInfo.name }}
  </h1>

  <p class="text-lg text-ink-secondary dark:text-ink-dark-secondary mb-8">
    {{ personalInfo.title }}
  </p>

  <p class="text-base leading-relaxed text-ink-secondary dark:text-ink-dark-secondary max-w-prose mb-10">
    {{ personalInfo.intro }}
  </p>

  <nav class="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm">
    <a [href]="personalInfo.github" target="_blank" rel="noopener noreferrer" class="link">GitHub</a>
    <a [href]="personalInfo.linkedin" target="_blank" rel="noopener noreferrer" class="link">LinkedIn</a>
    <a [href]="'mailto:' + personalInfo.email" class="link">Email</a>
    <a [href]="personalInfo.resume" target="_blank" rel="noopener noreferrer" class="link">Resume</a>
  </nav>
</header>
